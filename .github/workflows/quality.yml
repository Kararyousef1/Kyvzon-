name: Kyvzon Quality Gate

on:
  push:
    branches: [main, develop, 'remediation/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify no tracked environment files
        shell: bash
        run: |
          if git ls-files --error-unmatch .env .env.local >/dev/null 2>&1; then
            echo 'Tracked environment files are forbidden.'
            exit 1
          fi

      - name: Database contract check
        run: node scripts/check-db-contract.mjs

      - name: SDK boundary check
        run: node scripts/check-sdk-boundary.mjs

      - name: Type check
        run: npm run type-check

      - name: Unit and integration tests
        run: npm run test:run -- --reporter=dot

      - name: Core coverage gate
        run: npm run test:coverage -- --reporter=dot

      - name: Dependency audit
        run: npm audit --omit=optional --audit-level=high

      - name: Production build
        run: npm run build

  database:
    name: Database migrations & RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; then break; fi
            sleep 1
          done

      - name: Run clean-DB migration test + RLS isolation test
        run: bash scripts/tests/run_clean_db_test.sh
