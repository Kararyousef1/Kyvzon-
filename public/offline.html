<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Kyvzon — غير متصل</title>
    <style>
      :root { color-scheme: dark; font-family: Tajawal, Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
      main { width: min(90vw, 420px); padding: 32px; text-align: center; border: 1px solid #334155; border-radius: 24px; background: #111c33; box-shadow: 0 20px 60px #02061780; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: #4f46e5; font-size: 32px; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0 0 24px; color: #94a3b8; line-height: 1.8; }
      button { border: 0; border-radius: 12px; padding: 12px 20px; color: white; background: #4f46e5; cursor: pointer; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">◆</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من اتصالك ثم أعد المحاولة. ستبقى بيانات النظام الحية غير متاحة حتى عودة الاتصال.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
